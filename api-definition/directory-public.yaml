---
openapi: 3.0.0
info:
  title: Edifice - Directory - API (Public)
  description: Public subset of the Edifice Directory API documentation
  version: 4.10.0
servers:
  - url: /
tags:
  - name: user
    description: User
  - name: structure
    description: Structure
paths:
  /directory/user/{userId}:
    get:
      tags:
        - user
      summary: Récupère les détails d'un utilisateur par son identifiant
      description: >
        Retourne les informations détaillées d'un utilisateur.


        Contrôle d'accès (droits requis, du plus au moins permissif) : l'appelant
        doit être `SUPER_ADMIN`, ou être l'utilisateur lui-même, ou partager une
        structure avec l'utilisateur cible (administrateur de cette structure),
        ou être enseignant d'une classe de l'utilisateur cible, ou, à défaut,
        que l'utilisateur cible soit "visible" pour l'appelant selon les règles
        de visibilité de l'annuaire de la structure. Si aucune de ces conditions
        n'est remplie, la requête est rejetée (`403`).


        Lorsque l'accès n'est accordé que via la règle de "visibilité" (et non
        via un accès complet), la réponse est fortement restreinte : de
        nombreux champs sensibles sont retirés (coordonnées, email, téléphone,
        adresse, fonctions, structures, groupes, enfants/parents, etc.), et le
        champ `birthDate` n'est renvoyé que si la configuration serveur
        `enable-birthdate-in-get-user` est activée. Dans les autres cas
        (accès complet), le profil est renvoyé sans cette restriction.


        Certains champs internes/sensibles (mot de passe, jetons de
        réinitialisation, secrets MFA...) ne sont jamais renvoyés, quel que
        soit le niveau d'accès.
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier for the user.
          style: simple
          explode: false
          schema:
            type: string
        - name: manual-groups
          in: query
          required: false
          description: >
            Si `true`, inclut également les groupes manuels ("manualGroups")
            auxquels appartient l'utilisateur cible dans la réponse.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastLogin:
                    type: string
                    format: date-time
                  lastName:
                    type: string
                  zipCode:
                    type: string
                  city:
                    type: string
                  displayName:
                    type: string
                  source:
                    type: string
                  title:
                    type: string
                  login:
                    type: string
                  modified:
                    type: string
                    format: date-time
                  id:
                    type: string
                  email:
                    type: string
                  address:
                    type: string
                  created:
                    type: string
                    format: date-time
                  mobile:
                    type: string
                  structures:
                    type: array
                    items:
                      type: string
                  profiles:
                    type: array
                    items:
                      type: string
                  externalId:
                    type: string
                  needRevalidateTerms:
                    type: boolean
                  firstName:
                    type: string
                  structureNodes:
                    type: array
                    items:
                      type: object
                      properties:
                        created:
                          type: string
                          format: date-time
                        checksum:
                          type: string
                        name:
                          type: string
                        modified:
                          type: string
                          format: date-time
                        externalId:
                          type: string
                        feederName:
                          type: string
                        id:
                          type: string
                        source:
                          type: string
                  type:
                    type: array
                    items:
                      type: string
                  functions:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                  children:
                    type: array
                    items:
                      type: object
                      properties:
                        displayName:
                          type: string
                        externalId:
                          type: string
                        id:
                          type: string
                  parents:
                    type: array
                    items:
                      type: object
                      properties:
                        displayName:
                          type: string
                        externalId:
                          type: string
                        id:
                          type: string
                  functionalGroups:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        id:
                          type: string
                  administrativeStructures:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                  subjectCodes:
                    type: array
                    items:
                      type: string
        "404":
          description: Utilisateur introuvable, ou identifiant invalide.
        "403":
          description: >
            Accès refusé : l'appelant ne dispose d'aucun droit sur cet
            utilisateur (ni admin, ni lui-même, ni enseignant, ni visibilité
            d'annuaire).
        "302":
          description: Authentication failed. HTTP Client is redirected to $SERVER_DOMAIN/auth/login?callback=$SERVER_DOMAIN/
  /directory/structure/{id}/users:
    get:
      tags:
        - structure
      summary: Liste tous les utilisateurs d'une structure (établissement)
      description: >
        Retourne la liste des utilisateurs rattachés à la structure indiquée,
        avec pour chacun ses classes, groupes fonctionnels/manuels, fonctions,
        éventuels doublons détectés (utilisateurs liés par relation
        `DUPLICATE`) et rattachements administratifs.


        Contrôle d'accès : l'appelant doit être administrateur local (ADML)
        de cette structure précise (structure incluse dans son périmètre
        d'administration), ou `SUPER_ADMIN`. La double authentification (MFA)
        est requise si elle est configurée pour le compte.


        Si l'appelant n'est pas `SUPER_ADMIN`, les comptes ayant la fonction
        `SUPER_ADMIN` sont automatiquement exclus de la liste retournée.


        Selon la configuration serveur (`listUserMode`), la liste peut aussi
        inclure des utilisateurs "présupprimés" (désinscrits mais encore
        récupérables) rattachés à cette structure.

      parameters:
        - name: id
          in: path
          required: true
          style: simple
          explode: false
          description: This id represent structureId
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructureUsers"
        "401":
          description: >
            Session invalide ou utilisateur non résolu (`invalid.user`).
        "403":
          description: >
            Accès refusé : l'appelant n'est pas administrateur local de cette
            structure (ni `SUPER_ADMIN`), ou la double authentification (MFA)
            requise n'a pas été effectuée.
        "302":
          description: Authentification failed. HTTP Client is redirect to $SERVER_DOMAIN/auth/login?callback=
components:
  schemas:
    StructureUsers:
      type: array
      items:
        $ref: "#/components/schemas/StructureUser"
    StructureUser:
      required:
        - creationDate
        - displayName
        - externalId
        - firstName
        - id
        - lastName
        - login
        - source
        - type
      type: object
      properties:
        id:
          type: string
        externalId:
          type: string
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        type:
          $ref: "#/components/schemas/Profile"
        source:
          $ref: "#/components/schemas/Source"
        creationDate:
          type: string
        deleteDate:
          type: string
          description: Date when user account is pre-deleted. It will be definitively deleted (or hard deleted) 3 month after this date. That is de default configuration
        disappearanceDate:
          type: string
          description: Date when a user account disappear from feeding sources
        blocked:
          type: boolean
          description: User account can be blocked by the school's administrator
        code:
          type: string
          description: Activation code is a temporary password usefull for the first connexion
        attachmentId:
          type: string
        structures:
          type: array
          items:
            $ref: "#/components/schemas/StructureUser_structures"
        classes:
          type: array
          items:
            $ref: "#/components/schemas/StructureUser_structures"
        manualGroups:
          type: array
          items:
            type: string
        parents:
          type: array
          items:
            $ref: "#/components/schemas/ExportUser_parents"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ExportUser_children"
        functionalGroups:
          type: array
          items:
            type: string
        functions:
          type: array
          items:
            type: string
        duplicates:
          type: array
          items:
            type: string
        removedFromStructures:
          type: string
          description: // TODO
    StructureUser_structures:
      type: object
      properties:
        id:
          type: string
        externalId:
          type: string
        name:
          type: string
    ExportUser_parents:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    ExportUser_children:
      type: object
      properties:
        id:
          type: string
        attachmentId:
          type: string
        childExternalId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: string
    Profile:
      type: string
      enum:
        - Student
        - Teacher
        - Relative
        - Personnel
        - Guest
    Source:
      type: string
      enum:
        - AAF
        - CSV
        - MANUAL
