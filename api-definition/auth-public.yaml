---
openapi: 3.0.0
info:
  title: Edifice - Auth - API (Public)
  description: Public subset of the Edifice Auth API documentation
  version: 4.10.0
servers:
  - url: /
tags:
  - name: openid
    description: >
      Endpoints implémentant le flux OpenID Connect (Authorization Code Flow)
      permettant la fédération d'identité avec un fournisseur d'identité tiers.
paths:
  /auth/openid/certs:
    get:
      tags:
        - openid
      summary: Récupère les certificats du fournisseur d'identité OpenID Connect
      description: >
        Retourne les certificats publics (chargés au démarrage du serveur depuis
        la configuration `openid-connect.certs`) utilisés pour vérifier la
        signature des ID tokens émis par le fournisseur d'identité.
      responses:
        "200":
          description: >
            Succès. Retourne un objet JSON contenant la table des certificats
            actuellement chargés en mémoire (peut être vide si aucun certificat
            n'est configuré).
          content:
            application/json:
              schema:
                type: object
  /auth/openid/login:
    get:
      tags:
        - openid
      summary: Initie le flux d'authentification OpenID Connect
      description: >
        Point d'entrée du flux de connexion fédérée. Si une session utilisateur
        active existe déjà, l'utilisateur est directement redirigé vers `callback`
        (ou vers l'hôte courant si `callback` n'est pas fourni), sans repasser par
        le fournisseur d'identité.


        Si aucune session n'existe, l'endpoint :
          - résout la configuration du fournisseur OpenID Connect associée au
            domaine de la requête (renvoie une erreur si le domaine n'est pas
            fédéré),
          - génère un `state` (protection CSRF) et un `nonce` (protection contre
            le rejeu), stockés dans des cookies signés `csrfstate` et `nonce`
            (durée de vie : 900 secondes),
          - si `callback` est fourni, encode `state:baseUrl(callback)` dans le
            paramètre `state` afin de le faire transiter via le fournisseur
            d'identité et le restituer à l'étape `/auth/openid/authenticate`,
          - redirige le navigateur vers l'endpoint d'autorisation du fournisseur
            d'identité (`response_type=code`) avec les paramètres OAuth2 usuels
            (`client_id`, `redirect_uri`, `scope`, `state`, `nonce`).
      parameters:
        - name: callback
          in: query
          required: false
          description: >
            URL vers laquelle rediriger l'utilisateur une fois l'authentification
            terminée (ou immédiatement, si une session active existe déjà).
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: >
            Redirection soit vers `callback` (utilisateur déjà authentifié), soit
            vers la page d'autorisation du fournisseur d'identité OpenID Connect
            (utilisateur non authentifié).
        "400":
          description: L'URL fournie dans `callback` est mal formée.
        "403":
          description: >
            Aucun fournisseur OpenID Connect n'est configuré pour le domaine de
            la requête (`invalid.federate.domain`).
  /auth/openid/authenticate:
    get:
      tags:
        - openid
      summary: Callback OpenID Connect (retour du fournisseur d'identité)
      description: >
        Endpoint de redirection (`redirect_uri`) appelé par le fournisseur
        d'identité après authentification de l'utilisateur, avec les paramètres
        standards OAuth2 `code` et `state`.

        Traitement effectué :
          - vérifie la présence des cookies signés `csrfstate` et `nonce` posés
            lors de l'appel à `/auth/openid/login` (sinon `403`),
          - si le paramètre `state` contient un `callback` encodé (voir
            `/auth/openid/login`), le sépare en `state` et `callbackFromState`,
          - échange le code d'autorisation contre un jeton auprès du fournisseur
            d'identité, en validant `state`, la signature de l'ID token et le
            `nonce` (via le client OpenID Connect interne),
          - délègue ensuite la résolution de l'identité fédérée au fournisseur
            configuré (recherche de l'utilisateur en base à partir des
            informations du jeton, ou tentative de rapprochement par
            nom/date de naissance selon le fournisseur),
          - en cas de succès :
            - si la requête provient d'une application mobile (en-tête
              `User-Agent` commençant par `X-APP=mobile`), génère un jeton
              applicatif chiffré/signé et retourne une page HTML
              (`mobile-message.html`) exploitée par la webview de l'application,
            - sinon, crée une session serveur classique (cookies `oneSessionId`,
              `authenticated`, éventuellement `XSRF-TOKEN`) et redirige vers
              l'URL de callback d'origine (ou `/`),
          - si l'identité du fournisseur est inconnue et que le rapprochement
            manuel (`subMapping`) est activé, retourne une page HTML
            (`mappingFederatedUser.html`) permettant à l'utilisateur de relier
            son identité fédérée à un compte local existant.
      parameters:
        - name: code
          in: query
          required: true
          description: Code d'autorisation OAuth2 émis par le fournisseur d'identité.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: >
            Valeur `state` transmise lors de l'appel à `/auth/openid/login`,
            utilisée pour la protection CSRF et pouvant encoder l'URL de
            callback d'origine.
          schema:
            type: string
        - name: User-Agent
          in: header
          required: false
          description: >
            Utilisé pour détecter un client mobile applicatif (préfixe
            `X-APP=mobile`) et adapter la réponse (jeton applicatif vs session
            web classique).
          schema:
            type: string
      responses:
        "200":
          description: >
            Retourne une page HTML : soit `mobile-message.html` (jeton applicatif
            pour client mobile), soit `mappingFederatedUser.html` (rapprochement
            manuel d'identité fédérée).
          content:
            text/html: {}
        "302":
          description: >
            Authentification réussie : redirection vers l'URL de callback
            d'origine (ou `/`), session serveur créée.
        "401":
          description: >
            Échec de génération du jeton applicatif mobile
            (`AUTH_ERROR_AUTHENTICATION_FAILED`).
        "403":
          description: >
            Échec de validation : `invalid_state` (cookie CSRF absent),
            `invalid_replay` (cookie nonce absent), `invalid_token` (échange du
            code ou validation de l'ID token échoués), `invalid.payload`
            (identité fédérée non résolue et rapprochement manuel désactivé),
            ou `invalid.federate.domain` (domaine non fédéré).
